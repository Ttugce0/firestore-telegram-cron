name: Payment Reminder

on:
  schedule:
    # 09:00 - 09:30 TR (UTC 06)
    - cron: "*/5 6 * * *"

    # 12:00 - 12:30 TR (UTC 09)
    - cron: "*/5 9 * * *"

    # 15:00 - 15:30 TR (UTC 12)
    - cron: "*/5 12 * * *"

  workflow_dispatch:



jobs:
  run-cron:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Create Firebase key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      - name: Run payment reminder
        run: node checkPayments.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
