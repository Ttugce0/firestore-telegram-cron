name: Payment Reminder

on:
  schedule:
    # 09:00 TR
    - cron: "0 6 * * *"
    - cron: "5 6 * * *"
    - cron: "10 6 * * *"
    - cron: "15 6 * * *"
    - cron: "20 6 * * *"
    - cron: "25 6 * * *"
    - cron: "30 6 * * *"
    # 12:00 TR
    - cron: "0 9 * * *"
    - cron: "5 9 * * *"
    - cron: "10 9 * * *"
    - cron: "15 9 * * *"
    - cron: "20 9 * * *"
    - cron: "25 9 * * *"
    - cron: "30 9 * * *"
    # 15:00 TR
    - cron: "0 12 * * *"
    - cron: "5 12 * * *"
    - cron: "10 12 * * *"
    - cron: "15 12 * * *"
    - cron: "20 12 * * *"
    - cron: "25 12 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:



jobs:
  run-cron:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Create Firebase key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      - name: Run payment reminder
        run: node checkPayments.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
