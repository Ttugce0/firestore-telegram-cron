name: Hourly Firestore Payment Check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Istanbul
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Service account dosyası oluştur
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      - name: Paketleri yükle
        run: npm install

      - name: Firebase & Telegram cron çalıştır
        run: node checkPayments.js
